services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
      POSTGRES_DB: avito_kitchen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito_kitchen"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://avito:avito@postgres:5432/avito_kitchen?sslmode=disable"
      - "up"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://avito:avito@postgres:5432/avito_kitchen?sslmode=disable"
    ports:
      - "8080:8080"

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      HTTP_ADDR: ":9090"
      PLATFORM_BASE_URL: "http://api:8080"
    ports:
      - "9090:9090"

volumes:
  pgdata:
